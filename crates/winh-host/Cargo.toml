[package]
name = "wechat-winh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wechat-winh-bridge = { path = "../winh-bridge" }
wechat-voice-backend = { path = "../backend" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
sha2 = "0.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Pipes", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
