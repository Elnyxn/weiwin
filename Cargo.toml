[workspace]
members = ["crates/protocol", "crates/backend", "crates/audio", "crates/winh-bridge", "crates/winh-host", "crates/voice-cli", "crates/gui"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/Elnyxn/weiwin"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
